version: "3.8"

services:
  runnect-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runnect-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - kafka
    volumes:
      - ./logs:/app/logs
    networks:
      - runnect-net

  postgres:
    # PostGIS 확장(geometry 컬럼)이 필요해 일반 postgres 이미지 대신 사용
    image: postgis/postgis:15-3.4
    container_name: runnect-postgres
    environment:
      POSTGRES_DB: runnect
      POSTGRES_USER: runnect
      POSTGRES_PASSWORD: runnect_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - runnect-net

  redis:
    image: redis:7
    container_name: runnect-redis
    ports:
      - "6379:6379"
    networks:
      - runnect-net

  # 카프카 학습 실습용 — KRaft 모드(Zookeeper 불필요) 단일 브로커.
  # 실제 운영 부하를 감당할 목적이 아니라 프로듀서/컨슈머/파티션 병렬 처리를
  # 로컬에서 직접 검증하기 위한 것이라, prod/Render dev에는 올리지 않고
  # 이 로컬 docker-compose 안에서만 띄운다.
  kafka:
    image: apache/kafka:3.7.0
    container_name: runnect-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - runnect-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: runnect-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - runnect-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: runnect-logstash
    depends_on:
      - elasticsearch
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logs:/usr/share/logstash/logs
      - logstash_data:/usr/share/logstash/data
    ports:
      - "5044:5044"
    networks:
      - runnect-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: runnect-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - runnect-net

  prometheus:
    image: prom/prometheus:latest
    container_name: runnect-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - runnect-app
    networks:
      - runnect-net

  grafana:
    image: grafana/grafana:latest
    container_name: runnect-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - runnect-net

networks:
  runnect-net:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  logstash_data:
